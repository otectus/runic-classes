modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/otectus/runic-classes/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# The class layer is an Origins layer.
[[dependencies.${mod_id}]]
modId="origins"
mandatory=true
versionRange="${origins_version_range}"
ordering="AFTER"
side="BOTH"

# Class Perks and Powers register into Runic Skills' registries; 2.4.0 carries the hooks installed here.
[[dependencies.${mod_id}]]
modId="runicskills"
mandatory=true
versionRange="${runicskills_version_range}"
ordering="AFTER"
side="BOTH"

# Nothing in Runic Races is called; ordering only guarantees the heritage and race layers exist first.
[[dependencies.${mod_id}]]
modId="runic_races"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# The starter bag is a Treasure Bags bag when the mod is present, plain items otherwise.
[[dependencies.${mod_id}]]
modId="treasurebags"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Caster Perks and Powers have an Iron's Spells branch; every one has a vanilla fallback.
[[dependencies.${mod_id}]]
modId="irons_spellbooks"
mandatory=false
versionRange="[1.20.1-3.16.3,)"
ordering="AFTER"
side="BOTH"
