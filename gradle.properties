mod_name=Runic Classes
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.otectus
mod_authors=Otectus
mod_description=Runic Classes adds a class layer to the Runic suite: after heritage and race, choose one of thirteen classes or stay Classless. A class starts two Runic Skills Aptitudes at level 8, raises their caps by 8, and unlocks six class Perks and a Runic Mark, Seal and Crown no one else can take. Re-pick with a Class Orb.

# Sibling builds. Runic Skills has no Maven coordinate: tools/sync_runicskills_lib.py copies
# ../runic-skills/build/libs/runicskills-<v>.jar into libs/, resolved through the local.mods Ivy repo.
runicskills_version=2.4.0
runicskills_version_range=[2.4.0,)
origins_version_range=[1.10,)
