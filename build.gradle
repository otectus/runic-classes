plugins {
    id 'eclipse'
    id 'idea'
    // Pinned like Runic Skills, which this mod compiles against and whose conventions it follows.
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    // Forge GameTests (src/gametest/java). Separate from src/main so behavioural test code never ships
    // in the mod jar, and from src/test because these need a real server. Same shape as Runic Skills.
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Runic Skills, Origins and Apoli ship SRG refmaps; remap them for the Mojang-mapped dev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'forge.logging.console.level', 'info'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // Iron's Spells 'n Spellbooks, compile-only (the same CurseForge file Runic Skills uses).
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Sibling and local mod jars. A pattern-layout repository gives each file a coordinate fg.deobf
    // can remap; a flatDir entry has no module identity and would stay SRG-named in the dev runtime.
    ivy {
        url = uri("${projectDir}/libs")
        patternLayout { artifact '[artifact]-[revision](-[classifier]).[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'local.mods' }
    }
    ivy {
        url = uri("${projectDir}/Dependencies")
        patternLayout { artifact '[artifact]-[revision](-[classifier]).[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'local.deps' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Runic Skills 2.4.0+ carries the hooks this mod installs. libs/ is filled by tools/sync_runicskills_lib.py.
    compileOnly fg.deobf("local.mods:runicskills:${runicskills_version}")
    runtimeOnly fg.deobf("local.mods:runicskills:${runicskills_version}")
    // Runic Skills jar-in-jars MixinExtras; userdev does not unpack it, so the dev runtime names it directly.
    runtimeOnly fg.deobf('io.github.llamalad7:mixinextras-forge:0.4.0')

    // Origins Forge + Apoli + Calio, from Dependencies/ (gitignored, the same jars Runic Races uses).
    compileOnly files('Dependencies/origins-forge-1.20.1-1.10.0.9-all.jar')
    compileOnly files('Dependencies/apoli-forge-1.20.1-2.9.0.8.jar')
    compileOnly files('Dependencies/calio-forge-1.20.1-1.11.0.5.jar')
    runtimeOnly fg.deobf('local.deps:origins-forge-1.20.1:1.10.0.9:all')
    runtimeOnly fg.deobf('local.deps:apoli-forge-1.20.1:2.9.0.8')
    runtimeOnly fg.deobf('local.deps:calio-forge-1.20.1:1.11.0.5')
    runtimeOnly fg.deobf('local.deps:additionalentityattributes-forge:1.4.0.5+1.20.1')
    runtimeOnly fg.deobf('maven.modrinth:caelus:3.2.0+1.20.1')

    // Iron's Spells: compile-only. Everything that names it lives in integration/irons and loads
    // only when the mod is present; every caster Perk and Power has a vanilla fallback.
    compileOnly fg.deobf('curse.maven:irons-spells-n-spellbooks-855414:8680180')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
            runicskills_version_range: runicskills_version_range, origins_version_range: origins_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// The run configurations read the SRG->MCP table above; make sure it exists before any run starts.
tasks.matching { it.name == 'prepareRuns' }.configureEach { dependsOn 'createSrgToMcp' }

// Forge's GameTest server can exit zero after failing to load a world. Require a fresh success line.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    long startedAt = 0
    doFirst { startedAt = System.currentTimeMillis() }
    doLast {
        def resultLog = project.file('run/gametest/logs/latest.log')
        if (!resultLog.isFile() || resultLog.lastModified() < startedAt ||
                !(resultLog.getText('UTF-8') =~ /All [1-9][0-9]* required tests passed/).find()) {
            throw new GradleException("GameTests did not report successful completion. Inspect ${resultLog}")
        }
    }
}

// libs/runicskills-<v>.jar must be synced before anything compiles; say so instead of failing obscurely.
if (!file("libs/runicskills-${runicskills_version}.jar").isFile()) {
    logger.warn("libs/runicskills-${runicskills_version}.jar is missing: build ../runic-skills, then run python3 tools/sync_runicskills_lib.py")
}
